name: Build

# Every push and pull request builds and tests. A push to master also publishes the pom's version to
# packages.tstieh.de if it is not there yet — RainsCore and the client mod both read it from there.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPOSILITE_USERNAME: ${{ vars.REPOSILITE_USERNAME }}
  REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
  # Reposilite's TLS termination trips a TLSv1.3/SNI handshake bug in Maven's HTTP transport — pin TLSv1.2.
  MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Built with 25 like everything else here; the pom compiles for 21, which a 1.21.x client runs on.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: packages-releases
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_PASSWORD

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Releases are immutable in the registry, so a version is published exactly once: when it is not there yet.
      - name: Publish a new version to packages.tstieh.de
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          url="https://packages.tstieh.de/releases/de/raindancer/rains-client-protocol/$version/rains-client-protocol-$version.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "$REPOSILITE_USERNAME:$REPOSILITE_PASSWORD" "$url")
          echo "rains-client-protocol $version: $code"
          if [ "$code" = 404 ]; then
            mvn --batch-mode --no-transfer-progress -DskipTests deploy
          fi
